[project]
name = "oligogym"
version = "0.1.0"
description = ""
authors = [
    { name = "Carlo De Donno", email = "carlo.de_donno@roche.com" },
    { name = "Rachapun Rotrattanadumrong", email = "rachapun.rotrattanadumrong@roche.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4,<3",
    "pandas>=2.2.1,<3",
    "matplotlib>=3.8.3,<4",
    "seaborn>=0.13.2,<1",
    "scikit-learn==1.4.0",
    "pytorch-lightning==2.2.1",
    "xgboost>=2.0.3,<3",
    "python-levenshtein>=0.25.1,<1",
    "viennarna>=2.6.4,<3",
    "biopython>=1.84,<2",
    "tabpfn>=2.0.6,<3",
    "catboost>=1.2.8,<2",
    "torch-geometric>=2.7.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "pluggy==1.4.0",
    "flake8>=7.0.0,<8",
    "black>=24.3.0,<25",
    "openpyxl>=3.1.2,<4",
    "torchinfo>=1.8.0,<2",
    "isort>=5.13.2,<6",
    "ipython>=8.24.0,<9",
    "jupyterlab>=4.1.5,<5",
    "adjusttext>=1.1.1,<2",
    "colorcet>=3.1.0,<4",
    "sphinx>=8.2.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "sphinx-autoapi>=3.6.0,<4",
    "myst-nb>=1.2.0,<2",
    "pydata-sphinx-theme>=0.16.1,<1",
    "mlcroissant>=1.0.17,<2",
    "jupyter>=1.1.1,<2",
    "ipykernel>=7.1.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
